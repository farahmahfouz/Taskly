<div class="bg-white rounded-sm p-8 shadow-[0px_1px_2px_0px_#0000000D] h-66">
  <h3 class="text-[18px] weight-bold leading-7 pb-10">All Projects</h3>
  @for (project of projects; track $index) {
    <div class="flex items-center justify-between pb-4">
      <span class="weight-bold text-[12px] leading-4 text-[#041B3CB2]">{{ project.name }}</span>
      <span class="font-semibold text-[12px] text-neutral-dark">{{ project.tasks }} Tasks</span>
    </div>
  }
</div>
