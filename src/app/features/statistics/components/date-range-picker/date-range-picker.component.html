<div class="w-80 p-5">
  <!-- Header: Month / Year + Navigation -->
  <div class="flex items-center justify-between mb-2">
    <span class="leading-6 font-bold text-neutral-dark">{{ viewMonthLabel }}</span>
    <div class="flex items-center gap-1">
      <button type="button" (click)="prevMonth()" class="w-5 h-5 flex items-center justify-center rounded hover:bg-gray-100 text-gray-600 text-sm leading-none transition">
        ‹
      </button>
      <button type="button" (click)="nextMonth()" class="w-5 h-5 flex items-center justify-center rounded hover:bg-gray-100 text-gray-600 text-sm leading-none transition">
        ›
      </button>
    </div>
  </div>

  <!-- Weekday Labels -->
  <div class="grid grid-cols-7 mb-1">
    @for (label of weekdayLabels; track label) {
      <span class="text-center text-[10px] font-medium text-gray-400 py-1">{{ label }}</span>
    }
  </div>

  <!-- Calendar Grid -->
  <div class="grid grid-cols-7 gap-1">
    @for (day of calendarDays; track day.date.getTime(); let i = $index) {
      <button
        type="button"
        (click)="selectDay(day)"
        [class]="dayClasses(day, i)"
        class="relative h-8 text-xs font-medium flex items-center justify-center rounded-[1px] transition-colors"
      >
        {{ day.dayNumber }}
      </button>
    }
  </div>

  @if (errorMessage) {
    <p class="text-[10px] font-medium text-error mt-1.5">{{ errorMessage }}</p>
  }

  <div class="flex items-center justify-between mt-3 pt-4 border-t border-gray-100">
    <button
      type="button"
      (click)="cancelClick()"
      class="text-[12px] py-2 btn btn-ghost"
    >
      Cancel
    </button>
    <button
      type="button"
      (click)="applyClick()"
      [disabled]="!tempStart || !tempEnd"
      class="text-[12px] btn btn-primary"
    >
      Apply Range
    </button>
  </div>
</div>
