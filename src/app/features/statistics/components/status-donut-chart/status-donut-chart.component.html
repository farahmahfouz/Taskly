<div class="bg-white rounded-2xl p-8 shadow-[0px_1px_2px_0px_#0000000D] h-78">
  <h3 class="text-base font-bold mb-10">Tasks by Status</h3>
  <div class="flex items-center gap-9">
    <svg width="150" height="150" viewBox="0 0 150 150">
      <circle cx="75" cy="75" r="55" fill="none" stroke="#e7e9f2" stroke-width="22" />
      @for (seg of donutSegments; track $index) {
        <circle
          cx="75"
          cy="75"
          r="55"
          fill="none"
          [attr.stroke]="seg.color"
          stroke-width="22"
          [attr.stroke-dasharray]="seg.dash + ' ' + donutCircumference"
          [attr.transform]="'rotate(' + seg.rotate + ' 75 75)'"
        />
      }
      <text x="75" y="72" text-anchor="middle" font-size="26" font-weight="700" fill="#1c2333">
        {{ totalTasks }}
      </text>
      <text x="75" y="92" text-anchor="middle" font-size="12" fill="#8a90a3">Total</text>
    </svg>

    <div class="flex flex-col gap-4 flex-1">
      @for (item of legend; track $index) {
        <div class="flex flex-col gap-1.5">
          <div class="flex items-center gap-2.5 weight-bold text-[12px] leading-4 text-[#041B3CB2] text-nowrap">
            <span class="w-2.5 h-2.5 rounded-full shrink-0" [ngClass]="item.dotColor"></span>
            <span class="flex-1">{{ item.name }}</span>
            <span class="text-neutral-dark text-nowrap">{{ item.count }}</span>
          </div>
          <div class="w-full h-1.5 rounded-full bg-slate-100 overflow-hidden">
            <div
              class="h-full rounded-full"
              [style.background-color]="item.barColor"
              [style.width.%]="getPercent(item.count)"
            ></div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
