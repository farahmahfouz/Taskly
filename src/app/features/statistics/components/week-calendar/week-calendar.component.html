<div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
  <div
    *ngFor="let day of days"
    class="bg-white h-105 min-w-[126.86px] rounded-2xl p-4 min-h-75 shadow-[0px_1px_2px_0px_#0000000D] relative"
    [ngClass]="day.isToday ? 'border-2 border-primary pt-8' : 'border border-transparent'"
  >
    <span
      *ngIf="day.isToday"
      class="absolute -top-2.5 left-1/2 -translate-x-1/2 bg-primary text-white text-[10px] font-bold tracking-wide px-3 py-1 rounded-lg"
    >
      TODAY
    </span>

    <div class="text-2xs font-semibold tracking-wide" [ngClass]="day.isToday ? 'text-blue-700' : 'text-slate-400'">
      {{ day.name }}
    </div>
    <div class="text-[15px] font-bold mb-3.5">{{ day.date }}</div>

    <div
      *ngFor="let pill of day.pills"
      class="flex items-center justify-between rounded-lg px-2.5 py-2 text-2xs font-bold tracking-wide mb-2"
      [ngClass]="pill.classes"
    >
      <span
        [innerHTML]="pill.label.replace(' ', '<br/>')"
        *ngIf="pill.label === 'IN PROGRESS'; else plainLabel"
        class="leading-tight"
      ></span>
      <ng-template #plainLabel
        ><span>{{ pill.label }}</span></ng-template
      >
      <span>{{ pill.count }}</span>
    </div>

    <div
      *ngIf="day.pills.length === 0"
      class="flex flex-col items-center justify-center h-55 gap-2 text-[#c3c7d4] text-2xs font-semibold tracking-wide"
    >
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3" y="5" width="18" height="16" rx="2" />
        <line x1="3" y1="10" x2="21" y2="10" />
        <line x1="8" y1="3" x2="8" y2="7" />
        <line x1="16" y1="3" x2="16" y2="7" />
        <line x1="9" y1="15" x2="15" y2="18" />
        <line x1="15" y1="15" x2="9" y2="18" />
      </svg>
      NO TASKS
    </div>
  </div>
</div>
