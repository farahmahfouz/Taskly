<div class="flex items-center justify-between">
  <div class="bg-surface-low w-full flex justify-between p-4 rounded-sm relative">
    <div class="flex flex-col gap-1 justify-center">
      <div class="flex items-center gap-4 text-xs weight-bold leading-5 text-neutral-dark">
        <button type="button" (click)="prevWeek.emit()" class="hover:text-primary transition-colors">&#8249;</button>

        <button
          type="button"
          (click)="toggleDatePicker.emit()"
          class="hover:text-primary transition-colors"
          [class.text-error]="rangeError"
        >
          {{ dateRange }}
        </button>

        <button type="button" (click)="nextWeek.emit()" class="hover:text-primary transition-colors">&#8250;</button>
      </div>

      @if (rangeError) {
        <p class="text-2xs text-error weight-medium">{{ rangeError }}</p>
      }

      @if (showDatePicker) {
        <div
          class="absolute top-full mt-2 z-20 bg-white rounded-2xs shadow-[0px_4px_12px_0px_#0000001A]"
        >
          <app-date-range-picker
            [startDateISO]="startDateISO"
            [endDateISO]="endDateISO"
            [maxRangeDays]="maxRangeDays"
            (apply)="onRangeApply($event)"
            (cancel)="closeDatePicker.emit()"
          ></app-date-range-picker>
        </div>
      }
    </div>

    <div class="flex gap-2.5">
      <select
        class="w-51 px-4 py-2 rounded-2xs shadow-[0px_1px_2px_0px_#0000000D] bg-white text-xs weight-medium text-neutral-dark cursor-pointer"
        [value]="selectedProjectId"
        (change)="onProjectChange($event)"
      >
        <option value="">All Projects</option>
        @for (project of projectOptions; track project.id) {
          <option [value]="project.id">{{ project.name }}</option>
        }
      </select>

      <select
        class="px-4 py-2 rounded-2xs shadow-[0px_1px_2px_0px_#0000000D] bg-white text-xs weight-medium text-neutral-dark cursor-pointer"
        [value]="selectedStatus"
        (change)="onStatusChange($event)"
      >
        <option value="">All Statuses</option>
        @for (status of statusOptions; track status.value) {
          <option [value]="status.value">{{ status.label }}</option>
        }
      </select>
    </div>
  </div>
</div>
