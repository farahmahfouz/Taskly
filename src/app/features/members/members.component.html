<div class="flex flex-col gap-6 min-h-[726.5px]">
  @if (isLoading) {
    <app-skelton />
  } @else if (isError) {
    <app-error-page />
  } @else {
    <header class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div>
        <app-breadcrumb/>
        
        <h1 class="text-3xl font-semibold text-neutral-dark text-center md:text-start pt-4 md:pt-0">
          Projects Members
        </h1>
      </div>

      <a class="btn btn-primary bg-gradient-primary hidden md:flex" (click)="isOpen = true"> Invite Members </a>
    </header>

    <div class="bg-white rounded-lg md:border-4 border-[#F1F3FF] overflow-hidden md:w-197.25 md:mx-auto md:my-16">
      <div
        class="hidden md:grid grid-cols-[2fr_1fr_60px] items-center px-6 py-4 bg-[#E0E8FF4D] text-dark border-neutral-light text-2xs uppercase tracking-wide weight-bold"
      >
        <span>Member</span>
        <span class="ps-3">Role</span>
        <span class="text-center">Actions</span>
      </div>

      @for (member of members; track member.member_id) {
        <div
          class="flex items-center justify-between gap-4 md:grid md:grid-cols-[2fr_1fr_60px] px-6 py-5 border-b border-[#E8EDFF] last:border-none"
        >
          <div class="flex items-center gap-4">
            <div
              class="w-11 h-11 rounded-xl bg-[#E8F0FF] flex items-center justify-center text-xs font-bold text-primary"
            >
              {{ member.metadata.name | initials }}
            </div>

            <div class="flex flex-col">
              <span class="weight-semibold leading-sm text-xs text-neutral-dark">
                {{ member.metadata.name }}
              </span>

              <span class="text-[12px] text-dark weight-regular leading-3">
                {{ member.email }}
              </span>
            </div>
          </div>

          <div class="flex flex-col items-end gap-2 md:contents">
            <div class="md:ps-3">
              <span
                class="px-3 py-1 md:rounded-full text-[10px] uppercase weight-bold tracking-tighter"
                [ngClass]="{
                  'bg-[#0052CC] text-white': member.role === 'owner',
                  'bg-surface-low text-[#51617E]': member.role === 'admin',
                  'bg-gray-100 text-gray-700': member.role === 'member',
                  'bg-slate-100 text-slate-600': member.role === 'viewer',
                }"
              >
                {{ member.role }}
              </span>
            </div>

            <div class="flex justify-center">
              <button class="cursor-pointer">
                <svg class="text-dark size-4" icon-edit></svg>
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  }
  <div class="flex justify-end md:hidden mb-10">
    <a
      (click)="isOpen = true"
      class="w-14 h-14 rounded-xl bg-primary gradient-primary text-white text-2xl shadow-lg flex items-center justify-center"
    >
      <svg width="19" height="14" viewBox="0 0 19 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M14.1667 8.33333V5.83333H11.6667V4.16667H14.1667V1.66667H15.8333V4.16667H18.3333V5.83333H15.8333V8.33333H14.1667ZM6.66667 6.66667C5.75 6.66667 4.96528 6.34028 4.3125 5.6875C3.65972 5.03472 3.33333 4.25 3.33333 3.33333C3.33333 2.41667 3.65972 1.63194 4.3125 0.979167C4.96528 0.326389 5.75 0 6.66667 0C7.58333 0 8.36806 0.326389 9.02083 0.979167C9.67361 1.63194 10 2.41667 10 3.33333C10 4.25 9.67361 5.03472 9.02083 5.6875C8.36806 6.34028 7.58333 6.66667 6.66667 6.66667ZM0 13.3333V11C0 10.5278 0.121528 10.0938 0.364583 9.69792C0.607639 9.30208 0.930556 9 1.33333 8.79167C2.19444 8.36111 3.06944 8.03819 3.95833 7.82292C4.84722 7.60764 5.75 7.5 6.66667 7.5C7.58333 7.5 8.48611 7.60764 9.375 7.82292C10.2639 8.03819 11.1389 8.36111 12 8.79167C12.4028 9 12.7257 9.30208 12.9688 9.69792C13.2118 10.0938 13.3333 10.5278 13.3333 11V13.3333H0ZM1.66667 11.6667H11.6667V11C11.6667 10.8472 11.6285 10.7083 11.5521 10.5833C11.4757 10.4583 11.375 10.3611 11.25 10.2917C10.5 9.91667 9.74306 9.63542 8.97917 9.44792C8.21528 9.26042 7.44444 9.16667 6.66667 9.16667C5.88889 9.16667 5.11806 9.26042 4.35417 9.44792C3.59028 9.63542 2.83333 9.91667 2.08333 10.2917C1.95833 10.3611 1.85764 10.4583 1.78125 10.5833C1.70486 10.7083 1.66667 10.8472 1.66667 11V11.6667ZM6.66667 5C7.125 5 7.51736 4.83681 7.84375 4.51042C8.17014 4.18403 8.33333 3.79167 8.33333 3.33333C8.33333 2.875 8.17014 2.48264 7.84375 2.15625C7.51736 1.82986 7.125 1.66667 6.66667 1.66667C6.20833 1.66667 5.81597 1.82986 5.48958 2.15625C5.16319 2.48264 5 2.875 5 3.33333C5 3.79167 5.16319 4.18403 5.48958 4.51042C5.81597 4.83681 6.20833 5 6.66667 5Z"
          fill="white"
        />
      </svg>
    </a>
  </div>
</div>

<app-invite-members
  [isOpen]="isOpen"
  [projectId]="projectId"
  [projectName]="projectName"
  (close)="isOpen = false"
  (invited)="onMemberInvited()"
/>
